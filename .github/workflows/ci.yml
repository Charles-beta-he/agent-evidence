name: Read-only package regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installed-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved before candidate review
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved before candidate review
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions
        run: |
          python -m pip install 'build==1.4.0' 'setuptools==82.0.1' 'wheel==0.45.1'
          python -m build --no-isolation --outdir "$RUNNER_TEMP/artifacts"
      - name: Verify clean non-editable wheel and sdist installations
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python -m venv wheel-env
          wheel-env/bin/python -I -B -m pip install --no-index --no-deps artifacts/*.whl
          wheel-env/bin/python -I -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          mkdir unpacked
          python -c 'import glob,tarfile; tarfile.open(glob.glob("artifacts/*.tar.gz")[0]).extractall("unpacked",filter="data")'
          python -m build --wheel --no-isolation --outdir rebuilt unpacked/*
          python -m venv sdist-env
          sdist-env/bin/python -I -B -m pip install --no-index --no-deps rebuilt/*.whl
          sdist-env/bin/python -I -B -m unittest discover -s unpacked/*/tests -v
# This workflow is a proposed validation matrix, not evidence that it has run.
# No secret inputs, artifact publication, deployment, remote dispatch or write job.
