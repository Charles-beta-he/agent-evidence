[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence"
version = "0.1.0.dev0"
description = "Experimental bounded local evidence observations (incomplete implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
agent-evidence = "agent_evidence.cli:main"
agent-evidence-project = "agent_evidence_integration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_evidence*"]

[tool.setuptools]
include-package-data = false
